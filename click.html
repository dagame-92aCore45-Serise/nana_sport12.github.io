<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>For You ❤</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Noto+Sans+Khmer:wght@400;600&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="css.css" />
  </head>
  <body data-theme="rose">
    <div id="intro">
      <div>
        <div class="heart">❤</div>
        <h1 style="font-size: 3rem; color: var(--accent)">For You</h1>
        <p>Tap to open ✨</p>
        <button id="openBtn" style="font-size: 1.1rem; padding: 12px 28px">
          Open ❤
        </button>
      </div>
    </div>

    <div class="wrap">
      <header>
        <img class="sticker" src="image/sticker1.png" alt="" />
        <h1 id="title">For My Love</h1>
        <p id="sub">Every moment with you is my favorite song ♪</p>
      </header>

      <div class="card themes" id="themes">
        <button data-t="rose">🌸 Rose</button>
        <button data-t="night" class="alt">🌙 Night</button>
        <button data-t="sunset" class="alt">🌅 Sunset</button>
        <button data-t="mint" class="alt">🍃 Mint</button>
      </div>

      <div class="card">
        <div class="marquee"><div class="track" id="track"></div></div>
        <div class="add">
          <label class="btn"
            >📷 Add photos<input
              type="file"
              id="photoIn"
              accept="image/*"
              multiple
          /></label>
        </div>
      </div>

      <div class="card" id="playerCard">
        <div class="player">
          <div class="disc">♪</div>
          <div class="info">
            <b id="sTitle">—</b><small id="sArtist"></small>
          </div>
        </div>
        <input type="range" id="seek" value="0" min="0" max="100" step="0.1" />
        <div class="ctrl">
          <button id="prev">⏮</button>
          <button id="play" class="big">▶</button>
          <button id="next">⏭</button>
        </div>
        <ul id="list"></ul>
        <div class="add">
          <label class="btn"
            >🎵 Add songs<input
              type="file"
              id="songIn"
              accept="audio/*"
              multiple
          /></label>
        </div>
      </div>

      <div class="card msg">
        <h2 style="font-size: 2rem; color: var(--accent)">My message</h2>
        <p id="love">I love you more every day. Thank you for being you. ❤</p>
      </div>
    </div>

    <div id="toast"></div>
    <audio id="audio" preload="auto"></audio>

    <script src="js.js"></script>
  </body>
</html>
